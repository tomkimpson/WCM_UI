name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation OIDC token

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install host-side test deps
        run: pip install pytest

      # Explicit build step so a Dockerfile failure shows up here, not
      # buried in pytest fixture output. The conftest fixture will re-run
      # `docker build` with the same tag; cached layers make that fast.
      - name: Build worker image
        run: docker build -t wcm-ui/worker:test -f worker/Dockerfile .

      - name: Run image tests
        run: pytest tests/test_image_builds.py -v

      - name: Run smoke simulation
        run: pytest tests/test_smoke_sim.py -v

      - name: Run parametric sim
        run: pytest tests/test_run_with_params.py -v

      # Push to Artifact Registry on main only (PRs never push). We re-tag
      # the already-built `wcm-ui/worker:test` image rather than rebuilding.
      # Auth via Workload Identity Federation — no long-lived JSON keys in
      # GitHub Secrets. The GCP_WIF_PROVIDER and GCP_CI_SA_EMAIL repo
      # variables are populated by infra/scripts/up.sh's output.
      - name: Authenticate to GCP via WIF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA_EMAIL }}

      - name: Configure docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Tag and push worker image to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          IMAGE=us-central1-docker.pkg.dev/wcm-ui-dev/wcm-ui-worker/worker
          docker tag wcm-ui/worker:test "${IMAGE}:latest"
          docker tag wcm-ui/worker:test "${IMAGE}:sha-${{ github.sha }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${{ github.sha }}"

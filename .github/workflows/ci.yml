name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install host-side test deps
        run: pip install pytest

      # Explicit build step so a Dockerfile failure shows up here, not
      # buried in pytest fixture output. The conftest fixture will re-run
      # `docker build` with the same tag; cached layers make that fast.
      - name: Build worker image
        run: docker build -t wcm-ui/worker:test -f worker/Dockerfile .

      - name: Run image tests
        run: pytest tests/test_image_builds.py -v

      - name: Run smoke simulation
        run: pytest tests/test_smoke_sim.py -v

      - name: Run parametric sim
        run: pytest tests/test_run_with_params.py -v

      # Push to GHCR on main only, never on PRs. We re-tag the already-built
      # `wcm-ui/worker:test` image rather than rebuilding — saves the full
      # build cycle. After the first successful push, run once:
      #
      #   gh api -X PATCH /user/packages/container/wcm-ui-worker/visibility \
      #     -f visibility=public
      #
      # so Cloud Run Jobs can pull without an imagePullSecret.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push worker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          IMAGE=ghcr.io/${{ github.repository_owner }}/wcm-ui-worker
          docker tag wcm-ui/worker:test "${IMAGE}:latest"
          docker tag wcm-ui/worker:test "${IMAGE}:sha-${{ github.sha }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${{ github.sha }}"
